# Override de TESTE: acrescenta o Bot API FALSO ao Compose de producao e aponta o backend
# para ele. Nunca usar em ambiente real. Uso (a partir da raiz do repositorio):
#
#   docker compose -f docker-compose.production.yml \
#                  -f backend/test/fake-telegram/docker-compose.fake-telegram.yml up -d
#
# Variaveis esperadas no .env DE TESTE (valores ficticios):
#   TELEGRAM_API_BASE_URL=http://telegram-fake:8081
#   TELEGRAM_BOT_TOKEN=999000111:AAFAKE_token_so_para_testes_0123456789
#   TELEGRAM_POLLING_ENABLED=true  TELEGRAM_DELIVERY_MODE=n8n  (+ URL do webhook e chave)
services:
  telegram-fake:
    image: node:24.15.0-bookworm-slim
    restart: 'no'
    networks:
      - automation
    # SEM `ports`: so e alcancavel de dentro da rede `automation` (o backend o chama pelo nome).
    environment:
      FAKE_TELEGRAM_PORT: '8081'
      FAKE_TELEGRAM_TOKEN: ${TELEGRAM_BOT_TOKEN:?defina o token FICTICIO}
    volumes:
      - ./backend/test/fake-telegram/fake-bot-api.js:/fake/fake-bot-api.js:ro
    user: node
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: ['node', '/fake/fake-bot-api.js']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8081/__control/state').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    depends_on:
      telegram-fake:
        condition: service_healthy
