# ===========================================================================
# VastaFlow - corpo do ingress (locations, resolver, cabecalhos). Incluido DENTRO de um bloco
# `server` por:
#   - conf.d/vastaflow.conf                  : HTTP (:80), uso local/sem dominio;
#   - infra/https/vastaflow-https.conf.template : HTTPS (:443), producao com dominio.
# Um unico corpo para os dois: HTTP e HTTPS nao podem divergir em rota, limite ou bloqueio.
# O comentario longo de cada decisao (IP real, resolucao em tempo de requisicao, streaming, rotas de
# servico) esta abaixo, junto do codigo a que se refere.
# ===========================================================================

    include /etc/nginx/snippets/seguranca.conf;

    # Nao anuncia a versao do Nginx em resposta de erro.
    server_tokens off;

    # Log de acesso SEM query string (ver 01-log-format.conf). Sobrescreve o
    # `access_log ... main` do nginx.conf da imagem, que gravaria `?busca=<CPF>`.
    access_log /dev/stdout vastaflow_privacy;

    # --- resolucao do backend EM TEMPO DE REQUISICAO ----------------------
    #
    # Um `proxy_pass` com nome LITERAL resolve o nome UMA vez, na
    # inicializacao, e guarda o IP. Recriar o container do backend - que e
    # exatamente o que um deploy faz (`docker compose up -d` com imagem nova) -
    # pode dar a ele OUTRO IP, e o Nginx continua batendo no antigo: toda
    # requisicao vira 502 ate alguem reiniciar o Nginx. Reproduzido: com o
    # backend em 172.19.0.4 e o Nginx apontando para o 172.19.0.2, todas as
    # chamadas deram 502.
    #
    # Com o upstream em VARIAVEL o Nginx resolve a cada `valid` segundos, pelo
    # DNS embutido do Docker (127.0.0.11, fixo em redes definidas pelo usuario).
    # Efeito colateral bom: o Nginx deixa de exigir que `backend` resolva para
    # ARRANCAR, o que permite validar a sintaxe com `nginx -t` ja no build.
    #
    # Consequencia da variavel: o Nginx nao substitui mais o prefixo sozinho
    # (isso so acontece com `proxy_pass` literal e URI), entao cada location
    # reescreve a URI explicitamente com `rewrite ... break`.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:3000;

    root /usr/share/nginx/html;
    index index.html;

    # --- healthcheck do proprio Nginx -------------------------------------
    # Caminho interno, sem acesso ao disco, para o healthcheck do container.
    # A imagem alpine nao tem curl, mas tem o wget do busybox.
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # --- API --------------------------------------------------------------
    location /api/ {
        limit_req zone=vastaflow_api burst=60 nodelay;

        # Remove o prefixo /api: o backend recebe /auth/login, nao
        # /api/auth/login, e nenhuma rota precisou mudar. A query string e
        # preservada pelo `rewrite`.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # NOTE: `X-Forwarded-For $remote_addr` e NAO
        # `$proxy_add_x_forwarded_for`, de proposito. O segundo APENDA ao
        # cabecalho que o cliente enviou - e com `trust proxy = 1` o Express le
        # o ultimo item, que seria o que o Nginx acrescentou, mas a lista
        # inteira passaria a conter valor controlado pelo cliente. Como este
        # Nginx e a borda, sobrescrever e o correto: o cliente nao consegue
        # injetar nada em X-Forwarded-For.

        # Limite de corpo: casa com DOCUMENT_MAX_FILE_SIZE (10 MB, default de
        # `env.validation.ts`) mais folga para o envelope multipart. NAO e um
        # numero inventado - se a variavel mudar, este valor muda junto, senao
        # o backend aceitaria um arquivo que o Nginx recusou antes (ou o
        # contrario, e o 413 viria da camada errada).
        client_max_body_size 12m;

        # O upload passa pela MEMORIA do backend (multer em memory storage).
        # Deixar o Nginx bufferizar a requisicao em disco antes de repassar
        # evita manter a conexao do cliente ocupada, e nao piora a memoria do
        # Node: ele recebe o corpo de uma vez de qualquer forma.
        proxy_request_buffering on;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # --- login: limite mais restritivo -----------------------------------
    # Antes do /api/ generico porque `location =` tem precedencia exata.
    location = /api/auth/login {
        limit_req zone=vastaflow_auth burst=3 nodelay;

        rewrite ^ /auth/login break;
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 8k;
    }

    # --- troca de senha: mesmo limite do login, zona propria ---------------
    # Exige a senha atual: sem limite fino, um token roubado serviria para adivinha-la.
    location = /api/auth/change-password {
        limit_req zone=vastaflow_password burst=3 nodelay;

        rewrite ^ /auth/change-password break;
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 8k;
    }

    # --- rotas que fazem STREAMING ---------------------------------------
    #
    # As duas transmitem progressivamente, e o buffering do proxy anularia isso:
    #
    #   /finance/reports/export  `exportToStream` escreve direto no Writable da
    #                            resposta, e abre o stream so DEPOIS de validar
    #                            o periodo e contar as linhas (o 409 de 50.001
    #                            linhas sai sem escrever nada);
    #   /documents/:id/download  `object.stream.pipe(response)`, sem carregar o
    #                            arquivo na memoria.
    #
    # Com `proxy_buffering on` (o default), o Nginx acumularia a resposta
    # inteira em memoria/disco antes de repassar - o cliente esperaria o
    # arquivo todo e o cuidado de memoria do backend seria desperdicado.
    #
    # `proxy_buffering off` SOMENTE aqui. Desligar globalmente pioraria as
    # respostas JSON pequenas, que sao a maioria.
    location = /api/finance/reports/export {
        limit_req zone=vastaflow_api burst=10 nodelay;

        rewrite ^ /finance/reports/export break;
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        # 20.000 linhas levaram ~1,7 s medidos contra MySQL real; 50.000 (o
        # teto) extrapola para ~5 s. 300 s e folga, nao necessidade.
        proxy_read_timeout 300s;
    }

    location ~ ^/api/documents/[^/]+/download$ {
        limit_req zone=vastaflow_api burst=20 nodelay;

        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # --- readiness nao fica publico --------------------------------------
    # `GET /health/readiness` e @Public() porque quem consulta prontidao e
    # infraestrutura, que nao tem credencial. Mas ele revela o estado das
    # dependencias, e o healthcheck do container o alcanca por dentro da rede -
    # nao precisa estar aberto na internet. `/health` (liveness) continua
    # acessivel, por ser inocuo.
    # Webhook da Cloud API do WhatsApp: a UNICA rota de integracao exposta ao publico. A autenticidade
    # vem da assinatura X-Hub-Signature-256 verificada no backend (o corpo passa intacto, sem
    # reescrita). Corpo pequeno e zona de limite propria. O log `vastaflow_privacy` omite a query
    # string (nela vai o hub.verify_token da verificacao).
    location = /api/webhooks/whatsapp {
        limit_req zone=vastaflow_webhook burst=40 nodelay;

        rewrite ^ /webhooks/whatsapp break;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 256k;
        proxy_request_buffering on;
        proxy_read_timeout 60s;
    }

    location = /api/health/readiness {
        deny all;
    }

    # --- rotas de SERVICO nao ficam publicas -----------------------------
    # `/service/*` e a porta do n8n (`X-Service-Token`), e o n8n chega ao
    # backend direto, pela rede interna `automation`, sem passar por aqui. Pela
    # internet nao ha motivo para alcanca-la: bloquear no ingress tira a rota
    # da superficie publica e impede ate a tentativa de adivinhar credencial.
    # E uma SEGUNDA camada - o backend continua exigindo a credencial.
    #
    # Regex SEM diferenciar maiusculas, nao prefixo literal: o roteador do
    # Express ignora caixa por padrao, entao `/api/Service/identity` chega na
    # mesma rota - e passou por um `location ^~ /api/service` (verificado: 200
    # com o bloqueio literal). Regex vence o prefixo `/api/` generico. Sem barra
    # final: cobre `/api/service` e `/api/service/...`. O Nginx ja decodifica
    # %XX e funde barras antes de casar. 404 e nao 403, para nao confirmar que
    # a rota existe.
    location ~* ^/api/service {
        return 404;
    }

    # --- assets com hash: cache longo ------------------------------------
    # O Vite gera nomes com hash de conteudo, entao o arquivo e imutavel.
    location /assets/ {
        # Um unico `Cache-Control`. A primeira versao usava `expires 1y` E um
        # `add_header Cache-Control`, e a resposta saia com DOIS cabecalhos
        # (`max-age=31536000` e `public, immutable`) - o navegador combina, mas e
        # ambiguo e foi pego ao inspecionar a resposta real.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # `add_header` aqui descarta os cabecalhos do server; sem reincluir, os
        # .js e .css serviriam sem nosniff e sem os demais.
        include /etc/nginx/snippets/seguranca.conf;
        access_log off;
        try_files $uri =404;
    }

    # --- SPA: index.html nunca em cache ----------------------------------
    # Se o index.html ficasse em cache, o navegador pediria assets de uma
    # versao antiga depois de um deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/snippets/seguranca.conf;
    }

    # --- fallback do SPA --------------------------------------------------
    # O frontend tem 17 rotas no cliente e um catch-all que redireciona para
    # /dashboard. Sem isto, recarregar /finance/relatorios devolveria 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
