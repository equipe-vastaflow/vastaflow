# ===========================================================================
# Cabecalhos de seguranca e zonas de rate limit.
# ---------------------------------------------------------------------------
# ATENCAO: NAO VALIDADO. Nunca executado. Ver docs/containerizacao.md.
# ---------------------------------------------------------------------------
# Incluido pelo server block. Estes cabecalhos existem aqui porque o backend
# NAO tem `helmet` - a decisao foi deixar cabecalho de resposta para o proxy
# reverso, e esta e a parte que cumpre essa decisao.
# ===========================================================================

# --- Cabecalhos aplicados a toda resposta ---------------------------------

# O navegador nao adivinha o tipo pelo conteudo. O backend ja envia isto no
# download de documento; aqui vale para tudo.
add_header X-Content-Type-Options "nosniff" always;

# Nao vaza caminho nem query para outra origem.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Protecao contra enquadramento. `X-Frame-Options` para navegador antigo e
# `frame-ancestors` (na CSP abaixo) para o atual.
add_header X-Frame-Options "DENY" always;

# Nenhum destes recursos e usado pela aplicacao.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=(), payment=(), serial=(), midi=()" always;

# --- Content-Security-Policy ----------------------------------------------
#
# Montada contra o frontend REAL, nao copiada de um modelo:
#
#   script-src 'self'          o Vite gera arquivos .js separados com hash.
#                              NAO ha script inline no index.html gerado, e NAO
#                              ha `unsafe-inline` nem `unsafe-eval` aqui. Se
#                              algum dia um plugin passar a inlinar script, a
#                              correcao e o plugin, nao afrouxar isto.
#
#   style-src 'self' 'unsafe-inline'
#                              `unsafe-inline` e NECESSARIO e esta documentado:
#                              o React aplica estilo por atributo `style` em
#                              elementos, e a CSP trata atributo de estilo como
#                              inline. Sem isto, partes da interface perdem o
#                              estilo. O risco de `unsafe-inline` em STYLE e
#                              muito menor que em script (nao executa codigo).
#                              Alternativa futura: `style-src-attr` com nonce,
#                              que exige mudanca no frontend.
#
#   connect-src 'self'         a API e servida pelo MESMO host, sob /api/
#                              (ver vastaflow.conf). Em producao com
#                              subdominios separados, isto passa a
#                              `'self' https://api.<dominio>`.
#
#   img-src 'self' data:       `data:` porque icones embutidos sao comuns; nao
#                              ha carregamento de imagem externa.
#
#   object-src 'none'          sem plugin, sem applet.
#   base-uri 'self'            impede injecao de <base> que reescreveria URLs.
#   form-action 'self'         nenhum formulario posta para fora.
#   frame-ancestors 'none'     par moderno do X-Frame-Options.
#
# Importa especialmente porque o frontend guarda o JWT em `localStorage`: sem
# script inline nem eval, a superficie de XSS que alcancaria o token diminui
# muito. A solucao estrutural (cookie httpOnly) e mudanca de backend e esta no
# backlog, nao aqui.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

# --- HSTS: DELIBERADAMENTE AUSENTE neste arquivo --------------------------
#
# Em ambiente local servindo HTTP, `Strict-Transport-Security` e pior que
# inutil: o navegador passa a recusar HTTP para este host e guarda isso por
# `max-age`, o que e dificil de desfazer. HSTS entra junto com HTTPS real e
# certificado valido, na fase de deploy.
#
# Para producao, acrescentar no server block que termina TLS:
#   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# E so DEPOIS de confirmar que o HTTPS esta estavel - e sem `preload` ate ter
# certeza, porque a lista de preload e praticamente irreversivel.

# --- Zonas de rate limit --------------------------------------------------
#
# Definidas aqui (contexto http, via conf.d) e aplicadas por rota em
# vastaflow.conf. Chave: $binary_remote_addr, que depois do `real_ip` abaixo e
# o IP REAL do cliente, nao o do proxy.
#
# Os valores sao conservadores de proposito - rate limit nao substitui regra de
# negocio, e um limite apertado demais quebra uso legitimo:
#
#   api   30 req/s por IP, rajada de 60. Uma tela do VastaFlow dispara varias
#         chamadas (dados + /auth/me + paginacao + contagem de nao-lidas);
#         30/s cobre navegacao intensa com folga e ainda barra varredura.
#
#   auth  5 req/min por IP, rajada de 3. `/auth/login` custa CPU de proposito
#         (bcrypt com 12 rounds), entao e o alvo natural de forca bruta. Cinco
#         por minuto nao incomoda quem erra a senha algumas vezes.
limit_req_zone $binary_remote_addr zone=vastaflow_api:10m  rate=30r/s;
limit_req_zone $binary_remote_addr zone=vastaflow_auth:10m rate=5r/m;

# Recusa com 429 (e nao 503, o default), que e o codigo correto e o que o
# frontend sabe interpretar.
limit_req_status 429;
