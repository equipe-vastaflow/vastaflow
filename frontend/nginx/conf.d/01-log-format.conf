# ===========================================================================
# Formato do log de acesso (contexto http)
# ---------------------------------------------------------------------------
# O log de acesso padrao grava `$request`, que inclui a QUERY STRING. Ela pode
# carregar dado pessoal: as consultas ao Plantae aceitam `?busca=<CPF/CNPJ>`, e
# os filtros do financeiro identificam pessoas. Log de proxy nao e lugar para
# isso - fica em disco, e vai para onde quer que se mande o log.
#
# Este formato registra so o CAMINHO original (antes de qualquer rewrite) e
# descarta a query string, o `Referer` (que pode repetir a URL de outra pagina)
# e o usuario HTTP. Mantem o que serve para investigar: IP real, instante,
# metodo, caminho, status, tamanho e navegador.
#
# Carregado de conf.d/*.conf dentro de `http`; prefixo 01- porque vastaflow.conf
# o usa em `access_log`.
# ===========================================================================

# Tudo ate o primeiro "?" do URI ORIGINAL da requisicao. `$uri` nao serve: o
# `rewrite ... break` das rotas /api/ o troca pelo caminho interno.
map $request_uri $vastaflow_request_path {
    ~^(?<caminho>[^?]*) $caminho;
    default             '-';
}

log_format vastaflow_privacy '$remote_addr [$time_local] '
                             '"$request_method $vastaflow_request_path $server_protocol" '
                             '$status $body_bytes_sent "$http_user_agent"';
