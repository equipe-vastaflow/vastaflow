# HSTS (Strict-Transport-Security) so em conexoes HTTPS. Usado por snippets/seguranca.conf.
#
# max-age de UM DIA de proposito: HSTS e dificil de desfazer (o navegador recusa HTTP ate o prazo
# acabar). Depois de validar o HTTPS em producao por alguns dias, suba para 31536000 (1 ano) aqui e
# reconstrua a imagem do nginx. Sem `includeSubDomains` e sem `preload`: nao ha decisao sobre os
# outros subdominios do dominio da cliente.
map $scheme $vastaflow_hsts {
    default "";
    https   "max-age=86400";
}
