# ===========================================================================
# VastaFlow - nucleo web containerizado (production-like)
# ---------------------------------------------------------------------------
# VALIDADO em Docker Desktop (Engine 29.8.2 / Compose v5.5.1) em 2026-10-08:
# ordem de inicializacao, TLS com verificacao de identidade, isolamento de
# redes, persistencia dos dois volumes, healthchecks e limites. NAO validado: a
# VPS Linux, o HTTPS publico e o IP externo real do cliente. Ver
# docs/containerizacao.md para o que foi provado, o que foi corrigido ao
# executar e o que continua pendente.
# ---------------------------------------------------------------------------
#
# ESCOPO: nucleo web + n8n (Fase 3).
#
#   cliente -> nginx:80 -> estatico (SPA)
#                       -> /api/ -> backend:3000 -> (TLS) -> mysql:3306
#
#   n8n -> backend:3000        (rede `automation`, credencial de SERVICO)
#   n8n -> n8n-postgres:5432   (rede `n8n-internal`, interna)
#   editor do n8n: SOMENTE em 127.0.0.1 do host
#
# O n8n NAO tem rota ao MySQL: nao esta na rede `app-data`. O PostgreSQL e
# so do n8n e nao esta em nenhuma rede do nucleo.
#
# Ordem de inicializacao:
#   mysql (healthy) -> migrate (exit 0) -> backend (healthy) -> nginx
#   n8n-postgres (healthy) -> n8n
#
# USO (quando houver Docker):
#   1. ./scripts/gerar-tls-dev.sh            gera CA e certificado locais
#   2. cp .env.example .env  e preencha      NUNCA com segredo de producao
#   3. docker compose -f docker-compose.production.yml build \
#        --build-arg VITE_API_URL=/api
#   4. docker compose -f docker-compose.production.yml up -d
# ===========================================================================

name: vastaflow

# --------------------------------------------------------------------------
# Rotacao de log, aplicada a todos os servicos.
# Sem isto o driver json-file cresce sem limite e enche o disco da VPS. Os
# valores dao ~30 MB por servico, suficiente para investigar um incidente
# recente sem virar problema de espaco.
# --------------------------------------------------------------------------
x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  # ------------------------------------------------------------------------
  # Banco transacional. NAO publica porta: so existe na rede `app-data`.
  # ------------------------------------------------------------------------
  mysql:
    # Fixado em 8.4.9 - a MESMA versao contra a qual o TLS foi provado
    # localmente (ver docs/containerizacao.md).
    image: mysql:8.4.9
    restart: unless-stopped
    logging: *logging
    networks:
      - app-data
    # Deliberadamente SEM `ports:`. Expor 3306 no host anularia o isolamento,
    # e o Docker escreve direto no iptables - uma porta publicada passa por
    # cima do firewall do sistema.
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # TLS com a NOSSA CA. Os caminhos apontam para o bind mount read-only
      # abaixo. Os certificados que o MySQL auto-gera no datadir sao ignorados:
      # o CN deles e `MySQL_Server_<versao>_Auto_Generated_Server_Certificate`,
      # que nunca casaria com o hostname - comprovado localmente.
      - --ssl-ca=/etc/mysql/tls/ca.pem
      - --ssl-cert=/etc/mysql/tls/server-cert.pem
      - --ssl-key=/etc/mysql/tls/server-key.pem
      # Recusa conexao em texto puro. E o que transforma "TLS disponivel" em
      # "TLS obrigatorio".
      - --require-secure-transport=ON
      # Conservador para validacao local. Proposta para a KVM 4 em
      # docs/containerizacao.md - nao aplicar aqui.
      - --innodb-buffer-pool-size=256M
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD:?defina DATABASE_ROOT_PASSWORD no .env}
      MYSQL_DATABASE: ${DATABASE_NAME:?defina DATABASE_NAME no .env}
      MYSQL_USER: ${DATABASE_USER:?defina DATABASE_USER no .env}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:?defina DATABASE_PASSWORD no .env}
      # NAO definir MYSQL_PWD aqui. A primeira versao definia, para o healthcheck
      # nao expor a senha na linha de comando, e isso QUEBROU A INICIALIZACAO: o
      # cliente `mysql` do entrypoint le MYSQL_PWD antes de a senha de root
      # existir, recebe `Access denied`, o entrypoint aborta, e o container
      # reinicia. Na segunda subida o diretorio de dados ja existe, a
      # configuracao e pulada - e o container ficava `healthy` com root SEM
      # senha e SEM o banco e o usuario da aplicacao. Descoberto so ao executar.
    volumes:
      - mysql-data:/var/lib/mysql
      # Material TLS, somente leitura. A chave privada do servidor entra aqui e
      # em NENHUM outro lugar - o backend nunca a recebe.
      - ./infra/tls/mysql:/etc/mysql/tls:ro
    healthcheck:
      # Autentica como o USUARIO DA APLICACAO, por TCP, e executa uma query.
      #
      # Nao pode ser `mysqladmin ping`: ele sai com codigo 0 mesmo quando a
      # autenticacao falha ("mysqld is alive" - o servidor responde, ainda que
      # recuse a senha). Verificado: `ping` com senha errada imprimiu
      # `Access denied` e saiu com 0. Um healthcheck assim aprovaria um banco
      # sem usuario, sem senha ou sem o schema.
      #
      # TCP (-h127.0.0.1), nao socket: o entrypoint da imagem sobe um servidor
      # TEMPORARIO para a inicializacao, com --skip-networking, que so atende por
      # socket. Um check por socket ficaria `healthy` durante essa fase, antes do
      # servidor real - com TLS - existir, e o `migrate` tentaria conectar cedo.
      #
      # A senha vai por MYSQL_PWD SO neste comando (atribuicao inline do shell),
      # nao no ambiente do container, e `$$` e o escape do Compose para o `$`
      # chegar ao shell. Assim nao aparece em `ps` nem na linha de comando.
      test:
        - CMD-SHELL
        - MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h127.0.0.1 -u"$$MYSQL_USER" "$$MYSQL_DATABASE" -e 'SELECT 1' >/dev/null
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1g
        reservations:
          memory: 512m

  # ------------------------------------------------------------------------
  # Migrations, one-shot. Reutiliza a imagem do backend: mesmo `dist`, mesmas
  # dependencias, zero divergencia entre o que migra e o que roda.
  # ------------------------------------------------------------------------
  migrate:
    build:
      context: ./backend
    # NUNCA reinicia: migration que falha nao deve entrar em laco. O `backend`
    # depende de `service_completed_successfully`, entao falha aqui impede o
    # boot em vez de virar crash-loop.
    restart: 'no'
    logging: *logging
    networks:
      - app-data
    depends_on:
      mysql:
        condition: service_healthy
    environment: &backend-env
      NODE_ENV: production
      DATABASE_TYPE: mysql
      # NOME, nunca IP: com IP o driver nao envia `servername` e a validacao de
      # identidade do certificado seria saltada em silencio. A validacao de
      # ambiente recusa IP aqui, de proposito. Este nome tem de constar no SAN
      # do certificado do servidor.
      DATABASE_HOST: mysql
      DATABASE_PORT: '3306'
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_SSL: 'true'
      # A CA vem de ARQUIVO MONTADO, nao de conteudo inline: um PEM e
      # multilinha e valor multilinha em arquivo .env lido pelo Compose e
      # fragil. `*_FILE` e a convencao das proprias imagens oficiais de banco.
      DATABASE_SSL_CA_FILE: /etc/vastaflow/tls/ca.pem
      DATABASE_SYNCHRONIZE: 'false'
      SWAGGER_ENABLED: 'false'
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      DOCUMENT_STORAGE_PATH: /app/storage/documents
      TELEGRAM_POLLING_ENABLED: 'false'
    volumes:
      # SOMENTE a CA, somente leitura. Nem a chave da CA, nem a chave do
      # servidor chegam ao backend. O anchor fica no ITEM, nao na lista: na
      # lista, reusa-lo no `backend` produziria uma lista aninhada, que o
      # Compose recusa.
      - &ca-mount ./infra/tls/backend:/etc/vastaflow/tls:ro
    # `typeorm` e dependencia de RUNTIME, entao sobrevive ao `npm ci --omit=dev`
    # e o CLI existe na imagem final. NAO e `npm run migration:run` (faz
    # `nest build`, que vem de devDependency) e NAO e `npx` (pode tentar buscar
    # o pacote na rede).
    command:
      - node
      - node_modules/typeorm/cli.js
      - '-d'
      - dist/database/data-source.js
      - 'migration:run'
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512m

  # ------------------------------------------------------------------------
  # API. NAO publica porta: so e alcancavel pelo Nginx.
  # ------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    logging: *logging
    networks:
      - edge
      - app-data
      # Onde o n8n encontra o backend (`http://backend:3000`).
      - automation
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        # O backend NAO inicia se a migration nao terminou com codigo 0. E a
        # primeira das duas barreiras; a segunda e `PendingMigrationsCheck`,
        # que derruba o boot se ainda houver pendencia.
        condition: service_completed_successfully
    environment:
      <<: *backend-env
      PORT: '3000'
      APP_NAME: vasta-flow
      # Vazio: frontend e API ficam na MESMA origem (Nginx serve os dois), logo
      # o navegador nao faz requisicao cross-origin. Em producao com
      # subdominios separados, isto passa a ser https://app.<dominio>.
      FRONTEND_ORIGIN: ''
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Administrador}
      # Credenciais de SERVICO (n8n -> backend): arquivo de HASHES, nunca o
      # token. So o backend recebe esta variavel (por isso nao esta no anchor
      # compartilhado com `migrate`). Ver docs/autenticacao-servico-a-servico.md.
      SERVICE_CREDENTIALS_FILE: /etc/vastaflow/service-auth/credentials.json
      # Plantae (Fase 4): API externa SOMENTE de leitura, so homologacao. DESLIGADO
      # por padrao: sem PLANTAE_ENABLED=true nada e chamado. So o backend recebe
      # estas variaveis - NUNCA o n8n, o `migrate` ou o frontend. O token fica no
      # `.env` (fora do Git); note que variavel de ambiente aparece em
      # `docker inspect` para quem tem acesso ao Docker do host.
      PLANTAE_ENABLED: ${PLANTAE_ENABLED:-false}
      PLANTAE_BASE_URL: ${PLANTAE_BASE_URL:-}
      PLANTAE_API_TOKEN: ${PLANTAE_API_TOKEN:-}
      PLANTAE_TIMEOUT_MS: ${PLANTAE_TIMEOUT_MS:-}
      # Telegram + n8n (Fase 5). TUDO desligado por padrao: sem token e sem
      # POLLING_ENABLED=true nenhuma mensagem e lida. So o backend recebe estas
      # variaveis - NUNCA o n8n: o token do bot e a chave de assinatura ficam aqui.
      # O n8n so conhece o X-Service-Token (credencial dele, nao esta aqui).
      #   TELEGRAM_DELIVERY_MODE  direct (padrao) | n8n
      #   TELEGRAM_N8N_WEBHOOK_URL / TELEGRAM_INGEST_SIGNING_KEY: obrigatorias no modo n8n
      #   PLANTAE_CHAT_COMMANDS_ENABLED: libera /contas_pagar (opt-in proprio)
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_POLLING_ENABLED: ${TELEGRAM_POLLING_ENABLED:-false}
      TELEGRAM_DELIVERY_MODE: ${TELEGRAM_DELIVERY_MODE:-direct}
      TELEGRAM_N8N_WEBHOOK_URL: ${TELEGRAM_N8N_WEBHOOK_URL:-}
      TELEGRAM_INGEST_SIGNING_KEY: ${TELEGRAM_INGEST_SIGNING_KEY:-}
      PLANTAE_CHAT_COMMANDS_ENABLED: ${PLANTAE_CHAT_COMMANDS_ENABLED:-false}
      # Fase 6: atestado da organizacao (conferida com referencia INDEPENDENTE) e politica do
      # favorecido no chat. Ambos desligados por padrao; sem o atestado o backend RECUSA o boot
      # se o comando de chat for ligado com a integracao ativa.
      PLANTAE_ORGANIZATION_CONFIRMED: ${PLANTAE_ORGANIZATION_CONFIRMED:-false}
      PLANTAE_CHAT_SHOW_PAYEE_NAME: ${PLANTAE_CHAT_SHOW_PAYEE_NAME:-false}
      # Limite por remetente (mensagens/minuto) e SERVIDOR DE TESTE da Bot API. O segundo
      # fica VAZIO em producao: so aceita os hosts telegram-fake/localhost/127.0.0.1 e
      # existe para backend/test/fake-telegram (ver docs/telegram-n8n.md).
      TELEGRAM_USER_RATE_LIMIT_PER_MINUTE: ${TELEGRAM_USER_RATE_LIMIT_PER_MINUTE:-}
      TELEGRAM_API_BASE_URL: ${TELEGRAM_API_BASE_URL:-}
      # WhatsApp (Cloud API oficial da Meta). DESLIGADO por padrao (rotas 404). Ligado, exige TODAS as
      # variaveis; so o backend as recebe (nunca o n8n/frontend/migrate). O webhook publico passa pelo
      # Nginx em /api/webhooks/whatsapp e exige HTTPS na borda (ver docs/whatsapp.md).
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
      WHATSAPP_WEBHOOK_TOKEN: ${WHATSAPP_WEBHOOK_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_GRAPH_API_VERSION: ${WHATSAPP_GRAPH_API_VERSION:-}
      WHATSAPP_API_BASE_URL: ${WHATSAPP_API_BASE_URL:-}
    volumes:
      - *ca-mount
      # DIRETORIO, nao arquivo, e somente leitura. Diretorio porque o CLI
      # substitui o arquivo por `rename` (troca de inode) e um bind mount de
      # ARQUIVO continuaria apontando para o inode antigo, sem enxergar a
      # revogacao. Somente leitura porque o backend so le: ele nao tem como
      # criar nem alterar credenciais de servico.
      - ./infra/service-auth:/etc/vastaflow/service-auth:ro
      # Bytes dos documentos. Volume NOMEADO, nao bind mount de codigo.
      - documents:/app/storage/documents
    healthcheck:
      # A imagem node:slim nao tem curl nem wget - usa o proprio Node, que tem
      # `fetch` global desde a versao 18. Instalar curl so para o healthcheck
      # aumentaria a imagem e a superficie sem necessidade.
      test:
        - CMD
        - node
        - '-e'
        - "fetch('http://127.0.0.1:3000/health/readiness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          # Folgado por causa do upload: o multer bufferiza o arquivo INTEIRO na
          # memoria antes de ir ao storage. Com DOCUMENT_MAX_FILE_SIZE em 10 MB
          # o risco e pequeno; se subir, este limite e a rede de protecao.
          memory: 768m
        reservations:
          memory: 256m

  # ------------------------------------------------------------------------
  # Nginx: unico ingress. Serve o SPA (embutido na imagem) e faz proxy da API.
  # Nao ha servico `frontend` separado - o build e multi-stage e o `dist`
  # termina aqui, o que torna o deploy do frontend atomico.
  # ------------------------------------------------------------------------
  nginx:
    build:
      context: ./frontend
      args:
        # `/api` porque a API e servida pelo mesmo host, sob esse prefixo.
        # Obrigatoria: o build da imagem falha sem ela.
        VITE_API_URL: ${VITE_API_URL:-/api}
    restart: unless-stopped
    logging: *logging
    networks:
      - edge
    ports:
      # As UNICAS portas publicadas. HTTPS fica para a fase de deploy, com
      # dominio e certificado reais.
      - '${HTTP_PORT:-8080}:80'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # A imagem nginx:alpine nao tem curl, mas tem o wget do busybox.
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://127.0.0.1/nginx-health']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128m

  # ------------------------------------------------------------------------
  # PostgreSQL DO n8n. Nada do VastaFlow mora aqui (o negocio fica no MySQL).
  # NAO publica porta e so existe na rede interna `n8n-internal`.
  # ------------------------------------------------------------------------
  n8n-postgres:
    # Fixado. O diretorio de dados do Postgres 18+ mudou (PGDATA passou a ser
    # /var/lib/postgresql/18/docker): o volume monta em /var/lib/postgresql, o
    # que tambem evita o volume anonimo que a imagem criaria.
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    logging: *logging
    networks:
      - n8n-internal
    environment:
      POSTGRES_DB: ${N8N_DB_NAME:-n8n}
      POSTGRES_USER: ${N8N_DB_USER:-n8n}
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD:?defina N8N_DB_PASSWORD no .env}
    volumes:
      - n8n-postgres-data:/var/lib/postgresql
    # `cap_drop: ALL` NAO e aplicado aqui: o entrypoint da imagem precisa de
    # CHOWN/SETUID/SETGID/FOWNER para preparar o diretorio e baixar o
    # privilegio. `no-new-privileges` nao atrapalha isso.
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # Autentica como o usuario do n8n, por TCP, e executa uma query.
      #
      # `pg_isready` NAO serve: ele so diz que o servidor aceita conexao e sai
      # com 0 mesmo com credencial errada. TCP em vez de socket pela mesma razao
      # do MySQL: o servidor TEMPORARIO da inicializacao so atende por socket.
      #
      # Conecta pelo IP do PROPRIO container (`hostname -i`) e NAO por
      # 127.0.0.1: a imagem deixa o loopback em `trust` no pg_hba.conf, entao
      # por 127.0.0.1 QUALQUER senha passa - verificado: senha errada retornou
      # `1`. So conexoes nao-loopback caem na regra `scram-sha-256`.
      #
      # A senha vai por PGPASSWORD so neste comando; `$$` e o escape do Compose.
      test:
        - CMD-SHELL
        - PGPASSWORD="$$POSTGRES_PASSWORD" psql -h "$$(hostname -i | cut -d' ' -f1)" -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -tAc 'SELECT 1' | grep -qx 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384m
        reservations:
          memory: 128m

  # ------------------------------------------------------------------------
  # n8n (orquestrador). NAO tem acesso ao MySQL, NAO monta o socket do Docker
  # e NAO e privilegiado. Chama o backend com a credencial de SERVICO.
  # ------------------------------------------------------------------------
  n8n:
    # Imagem oficial, versao fixada (nunca `latest`).
    image: docker.n8n.io/n8nio/n8n:2.43.1
    restart: unless-stopped
    logging: *logging
    networks:
      # `n8n-internal`: o PostgreSQL. `automation`: o backend e a unica rota de
      # saida (nao e `internal` porque o editor precisa ser publicado em
      # loopback; o n8n precisara de saida quando houver canais).
      - n8n-internal
      - automation
    depends_on:
      n8n-postgres:
        condition: service_healthy
    ports:
      # SOMENTE loopback. Nunca 0.0.0.0: o editor tem login, mas e uma
      # superficie administrativa que nao deve ficar na rede. Acesso remoto, se
      # um dia for preciso, e por tunel SSH.
      - '127.0.0.1:${N8N_EDITOR_PORT:-5678}:5678'
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-postgres
      DB_POSTGRESDB_PORT: '5432'
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME:-n8n}
      DB_POSTGRESDB_USER: ${N8N_DB_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      # Chave que cifra as credenciais guardadas no banco. EXPLICITA: se for
      # gerada sozinha, ela mora so no volume do n8n, e perder o volume perde
      # tudo que o banco guarda. Backup separado, FORA da VPS.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?defina N8N_ENCRYPTION_KEY no .env}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-America/Sao_Paulo}
      TZ: ${GENERIC_TIMEZONE:-America/Sao_Paulo}
      N8N_HOST: 127.0.0.1
      N8N_PORT: '5678'
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://127.0.0.1:${N8N_EDITOR_PORT:-5678}
      # Cookie `Secure` ligado por padrao. Em http://127.0.0.1 o navegador o
      # aceita (loopback e contexto seguro); na VPS o editor so sera acessado
      # por HTTPS ou tunel.
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-true}
      # Workflow nao le variaveis de ambiente do processo (onde estao a chave e
      # a senha do banco).
      N8N_BLOCK_ENV_ACCESS_IN_NODE: 'true'
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: 'true'
      # Sem telemetria, sem checagem de versao, sem modelos externos.
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_VERSION_NOTIFICATIONS_ENABLED: 'false'
      N8N_TEMPLATES_ENABLED: 'false'
      N8N_PERSONALIZATION_ENABLED: 'false'
      # Nodes que executam comando ou mexem em arquivo no proprio container.
      NODES_EXCLUDE: '["n8n-nodes-base.executeCommand","n8n-nodes-base.readWriteFile","n8n-nodes-base.localFileTrigger"]'
      # Historico de execucao e dado: poda para nao crescer sem limite (14 dias).
      EXECUTIONS_DATA_PRUNE: 'true'
      EXECUTIONS_DATA_MAX_AGE: '336'
      # Mensagens do Telegram (e as respostas, que podem ter dado financeiro)
      # passam por este n8n. NAO guardar o conteudo das execucoes: nem as
      # bem-sucedidas, nem as com erro. O workflow tambem declara isto. Para
      # depurar, mude TEMPORARIAMENTE e limpe o historico depois.
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: 'false'
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: 'false'
      # ATENCAO (achado da Fase 5.2): "nao salvar" NAO significa "nunca gravar". O n8n grava a
      # execucao (inclusive o corpo do webhook: texto do comando, ids do Telegram e o envelope)
      # ao INICIAR e, ao terminar, so a marca como apagada (soft-delete); o apagamento fisico
      # espera `EXECUTIONS_DATA_HARD_DELETE_BUFFER` (padrao 1 h) e roda a cada
      # `EXECUTIONS_DATA_PRUNE_HARD_DELETE_INTERVAL` (padrao 15 min). Aqui o buffer e 0 e a
      # varredura e de 1 min: o dado fica no PostgreSQL por ~1-2 min, nao ~1 h 15 min.
      # Continua sendo retencao transitoria, nao ausencia de gravacao (docs/telegram-n8n.md).
      EXECUTIONS_DATA_HARD_DELETE_BUFFER: '0'
      EXECUTIONS_DATA_PRUNE_HARD_DELETE_INTERVAL: '1'
      # Uma mensagem de chat e minuscula: corpo maximo de 1 MiB no webhook.
      N8N_PAYLOAD_SIZE_MAX: '1'
    volumes:
      - n8n-state:/home/node/.n8n
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      # `/healthz/readiness` so responde 200 com o banco conectado e as
      # migrations aplicadas (`/healthz` responde 200 mesmo sem banco). A
      # imagem tem o wget do busybox.
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://127.0.0.1:5678/healthz/readiness']
      interval: 15s
      timeout: 5s
      retries: 5
      # O boot a frio levou ~4-5 min no Docker Desktop (VM de 4 CPU / 3,8 GB):
      # o n8n 2.x carrega centenas de nos e roda ~300 migrations na primeira
      # vez. Com 40 s ele aparecia `unhealthy` durante um boot normal.
      start_period: 360s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768m
        reservations:
          memory: 256m

networks:
  # Borda: quem fala HTTP. O MySQL NAO esta aqui.
  edge:
    driver: bridge
  # Dados: backend/migrate <-> mysql. O Nginx NAO esta aqui.
  app-data:
    driver: bridge
    # Sem acesso a internet: este segmento so precisa falar com o banco.
    internal: true
  # n8n <-> backend. O MySQL NAO esta aqui (o n8n nao o alcanca) e o Nginx
  # tambem nao. Nao e `internal`: um container so em redes internas nao tem
  # como publicar porta, e o editor do n8n precisa de 127.0.0.1:5678.
  automation:
    driver: bridge
  # n8n <-> seu PostgreSQL. Sem saida e sem nenhum outro servico.
  n8n-internal:
    driver: bridge
    internal: true

volumes:
  mysql-data:
    name: vastaflow-mysql-data
  documents:
    name: vastaflow-documents
  # Estado do n8n (/home/node/.n8n) e dados do PostgreSQL dele. Nao apagar:
  # contem workflows e credenciais cifradas.
  n8n-state:
    name: vastaflow-n8n-state
  n8n-postgres-data:
    name: vastaflow-n8n-postgres-data
